name: owl-open-shadow-pr
# ADR-044 — fecha o follow-up "tokenless launchd não abre PR" (ADR-010): quando o
# run agendado der push numa branch owl/evolve-*, o GitHub abre o shadow PR sozinho.
on:
  push:
    branches:
      - 'owl/evolve-**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: `${context.repo.owner}:${branch}` });
            if (prs.data.length > 0) { core.info(`PR já existe: #${prs.data[0].number}`); return; }
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🦉 ${branch} (shadow)`,
              head: branch, base: 'main',
              body: [
                'Shadow PR aberto automaticamente pelo workflow (ADR-044) após push da run agendada.',
                '',
                '- Landing mode: `pr` (shadow) — `main` intocada pelo loop.',
                '- Revisão humana é o merge gate (NFR-SEC-1).',
                '- Detalhes do ciclo: `CHANGELOG.md` (Unreleased) + `research-vault/log.md` + `.owl/state/last-run.json`.'
              ].join('\n') });
            core.info(`PR aberto: #${pr.data.number}`);
